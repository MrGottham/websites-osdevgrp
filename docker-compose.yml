services:

  websites:
    image: websites
    build:
      context: .
      dockerfile: Dockerfile
      args:
        mySqlHost: ${mySqlHost}
        mySqlDefaultUser: ${mySqlDefaultUser}
        mySqlDatabase: ${mySqlDatabase}
        mySqlCharset: ${mySqlCharset}
        realm: ${realm}
        reduceFoodWasteHost: ${reduceFoodWasteHost}
        sshPassword: ${sshPassword}
    ports:
      - "80:80"
      - "443:443"
      - "8022:2222"
    restart: always
